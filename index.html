<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KAVRIQEN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="KAVRIQEN. Premium everyday-use home, kitchen and lifestyle essentials for Bangladesh. Elevate Everyday Living.">
<meta name="theme-color" content="#101B2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&text=%E0%A7%B3&display=swap">
<style>
/* Art direction: midnight-navy header and hero, warm ivory pages, soft gold only for accents and rules.
   Large Bodoni headlines over Jost body text. Arched product frame in the hero. One config block in the script drives all content. */
:root{
  --navy:#101B2D; --midnight:#0B1220; --gold:#C6A66B; --gold-ink:#7E6329; --ivory:#F7F5F0; --white:#FFFFFF;
  --navy-2:#16243B; --muted:#505B6E; --muted-dark:#B3BBC8;
  --line:rgba(16,27,45,.14); --line-dark:rgba(247,245,240,.16);
  --shadow:0 24px 48px -24px rgba(11,18,32,.38);
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --sans:'Jost','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,.7,.2,1); --hdr:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--ivory);color:var(--navy);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:70}
body.lock{overflow:hidden}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.i{display:inline-block;vertical-align:middle;flex:none}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(64px,9vw,120px)}
.sec-navy{background:var(--navy);color:var(--ivory)}
.sec-white{background:var(--white)}
.eyebrow{font:500 12px/1.2 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold-ink)}
.sec-navy .eyebrow,.hero .eyebrow{color:var(--gold)}
h1,h2,.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
h2{font-size:clamp(2rem,4.8vw,3.4rem);line-height:1.08;text-wrap:balance}
h2 em,h1 em{font-style:italic;color:var(--gold-ink)}
.sec-navy h2 em,.hero h1 em{color:var(--gold)}
.lede{font-size:clamp(17px,2vw,19px);color:var(--muted);max-width:52ch}
.sec-navy .lede,.hero .lede{color:var(--muted-dark)}
.sec-head{display:grid;gap:14px;margin-bottom:clamp(36px,5vw,64px);max-width:60ch}
.sec-head.c{margin-inline:auto;text-align:center;justify-items:center}
.ph{background:rgba(198,166,107,.22);border-bottom:1px dashed var(--gold-ink);padding:0 3px;border-radius:2px}
.sec-navy .ph{border-bottom-color:var(--gold)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 30px;border:1px solid transparent;border-radius:2px;font:500 12.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
.btn .i{transition:transform .3s var(--ease)}
.btn:hover .i.arrow{transform:translateX(4px)}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:var(--midnight)}
.btn-gold:hover{background:var(--ivory);box-shadow:0 10px 30px -12px rgba(198,166,107,.7)}
.btn-navy{background:var(--navy);color:var(--ivory)}
.btn-navy:hover{background:var(--midnight);box-shadow:0 12px 28px -14px rgba(11,18,32,.6)}
.btn-line{border-color:var(--navy);color:var(--navy);background:transparent}
.btn-line:hover{background:var(--navy);color:var(--ivory)}
.btn-line-light{border-color:rgba(247,245,240,.4);color:var(--ivory);background:transparent}
.btn-line-light:hover{border-color:var(--gold);color:var(--gold)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-block{width:100%}
.link-u{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--gold)}

/* announcement + header */
.ann{background:var(--navy);color:var(--gold);text-align:center;font:500 11px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:11px 16px;border-bottom:1px solid var(--line-dark)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy);color:var(--ivory);border-bottom:1px solid var(--line-dark)}
.hdr .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--hdr)}
.nav{display:flex;gap:30px}
.nav a{font:500 12.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;padding:8px 0;position:relative;color:var(--muted-dark);transition:color .3s}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:var(--gold);transition:right .35s var(--ease)}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ivory)}
.nav a:hover::after,.nav a[aria-current="page"]::after{right:0}
.logo{font:500 19px/1 var(--serif);letter-spacing:.34em;text-decoration:none;color:var(--ivory);padding-left:.34em}
.hdr-r{display:flex;justify-content:flex-end}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:46px;height:46px;background:transparent;border:0;color:inherit;border-radius:50%;transition:color .3s}
.icon-btn:hover{color:var(--gold)}
.badge{position:absolute;top:5px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--midnight);font:600 11px/18px var(--sans);text-align:center}
.burger{display:none;justify-self:start;margin-left:-10px}
@media (max-width:860px){.nav{display:none}.burger{display:inline-grid}.logo{font-size:16px}}

/* mobile menu */
.menu{position:fixed;inset:0;z-index:80;background:var(--midnight);color:var(--ivory);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));transform:translateY(-100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
.menu.open{transform:none;visibility:visible;transition-delay:0s}
.menu-top{display:flex;justify-content:space-between;align-items:center;height:50px}
.menu ul{margin-top:auto;margin-bottom:auto;display:grid;gap:6px}
.menu li a{display:block;font:400 clamp(2.4rem,11vw,3.4rem)/1.15 var(--serif);text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line-dark);transition:color .3s,padding-left .3s var(--ease)}
.menu li a:hover,.menu li a[aria-current="page"]{color:var(--gold);padding-left:8px}
.menu small{color:var(--muted-dark);font-size:13px;letter-spacing:.06em}

/* hero */
.hero{background:var(--navy);color:var(--ivory);overflow:hidden}
.hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(40px,7vw,96px)}
.hero h1{font-size:clamp(2.7rem,7.6vw,5.6rem);line-height:1.02;margin:20px 0 24px;text-wrap:balance}
.hero h1 em{display:block}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.hero-points{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:40px;color:var(--muted-dark);font-size:14px}
.hero-points li{display:flex;align-items:center;gap:8px}
.hero-points .i{color:var(--gold)}
.arch{position:relative;justify-self:center;width:min(100%,460px)}
.arch .frame{aspect-ratio:6/7;border-radius:999px 999px 4px 4px;overflow:hidden;background:var(--navy-2);box-shadow:0 40px 70px -30px rgba(0,0,0,.6)}
.arch::after{content:"";position:absolute;inset:-14px 14px 14px -14px;border:1px solid rgba(198,166,107,.5);border-radius:999px 999px 4px 4px;z-index:-1}
.frame svg,.frame img,.tile svg,.tile img{display:block;width:100%;height:100%;object-fit:cover}
@media (max-width:860px){.hero-in{grid-template-columns:minmax(0,1fr)}.arch{width:min(88%,380px);margin-top:12px}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise .9s var(--ease) both;animation-delay:var(--d,0s)}
#app.enter{animation:fade .5s var(--ease) both}

/* trust strip */
.strip{background:var(--ivory);border-bottom:1px solid var(--line)}
.strip ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.strip li{display:flex;align-items:center;gap:12px;padding:22px 0;font-size:14px;letter-spacing:.02em}
.strip .i{color:var(--gold-ink)}
@media (max-width:760px){.strip ul{grid-template-columns:minmax(0,1fr);gap:0}.strip li{padding:14px 0;border-bottom:1px solid var(--line)}.strip li:last-child{border:0}}

/* product view */
.pv{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(28px,5vw,80px);align-items:start}
.gal-main{position:relative;aspect-ratio:6/7;background:var(--navy);border-radius:4px;overflow:hidden;box-shadow:var(--shadow);touch-action:pan-y}
.gal-main>*{animation:fade .45s var(--ease)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.thumb{padding:0;border:1px solid transparent;background:var(--navy);border-radius:3px;overflow:hidden;aspect-ratio:1;opacity:.6;transition:opacity .3s,border-color .3s}
.thumb:hover{opacity:1}
.thumb[aria-current="true"]{opacity:1;border-color:var(--gold)}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pv-info{display:grid;gap:20px;align-content:start}
.pv-info h1,.pv-info h2{font-size:clamp(2rem,4vw,3rem);line-height:1.08}
.price-row{display:flex;align-items:baseline;gap:14px}
.price{font:500 clamp(26px,3vw,32px)/1 var(--sans);letter-spacing:.01em}
.was{color:var(--muted);text-decoration:line-through;font-size:18px}
.avail{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.avail::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.avail.out::before{background:transparent;border:1px solid var(--muted)}
.buy-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:stretch}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:2px;background:var(--white)}
.qty button{width:46px;min-height:50px;border:0;background:transparent;display:grid;place-items:center;transition:background .2s}
.qty button:hover{background:var(--ivory)}
.qty output{min-width:34px;text-align:center;font-weight:500}
.buy-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-trust{display:grid;gap:10px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.mini-trust li{display:flex;gap:12px;align-items:center}
.mini-trust .i{color:var(--gold-ink)}
@media (max-width:860px){.pv{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.buy-btns{grid-template-columns:minmax(0,1fr)}.buy-row{grid-template-columns:minmax(0,1fr)}.qty{justify-content:space-between}}

/* benefits */
.benefits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.benefit{padding:34px 28px 34px 0;border-right:1px solid var(--line);display:grid;gap:16px;align-content:start}
.benefit:last-child{border:0}
.benefit .ic{width:52px;height:52px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold-ink)}
.benefit h3{font:500 22px/1.2 var(--serif)}
.benefit p{color:var(--muted);font-size:15px}
@media (max-width:980px){.benefits{grid-template-columns:repeat(2,minmax(0,1fr))}.benefit{border-right:0;border-bottom:1px solid var(--line);padding-right:16px}}
@media (max-width:560px){.benefits{grid-template-columns:minmax(0,1fr)}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);counter-reset:s}
.step{position:relative;padding-top:28px;border-top:1px solid var(--line-dark);display:grid;gap:14px;align-content:start}
.step .n{font:italic 400 64px/1 var(--serif);color:var(--gold)}
.step h3{font:500 28px/1.1 var(--serif)}
.step p{color:var(--muted-dark)}
.step .art{aspect-ratio:4/3;background:var(--navy-2);border-radius:3px;display:grid;place-items:center;margin-bottom:6px}
.step .art svg{width:70%;height:70%}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}

/* story */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,96px);align-items:center}
.story .big{font:400 clamp(2.2rem,5vw,4rem)/1.05 var(--serif);text-wrap:balance}
.story .big em{font-style:italic;color:var(--gold-ink)}
.story .copy{display:grid;gap:18px;color:var(--muted)}
.story .copy p:first-child::first-letter{font:400 3.2em/.8 var(--serif);float:left;padding:6px 10px 0 0;color:var(--navy)}
.sign{font:500 12px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold-ink)}
@media (max-width:860px){.story{grid-template-columns:minmax(0,1fr)}}

/* why */
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.why-item{display:grid;gap:12px;align-content:start;padding-top:22px;border-top:1px solid var(--gold)}
.why-item h3{font:500 22px/1.2 var(--serif)}
.why-item p{color:var(--muted-dark);font-size:15px}
@media (max-width:980px){.why{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.why{grid-template-columns:minmax(0,1fr)}}

/* showcase */
.show{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.tile{position:relative;overflow:hidden;border-radius:3px;background:var(--navy);margin:0}
.tile svg,.tile img{transition:transform 1.2s var(--ease)}
.tile:hover svg,.tile:hover img{transform:scale(1.04)}
.tile figcaption{position:absolute;left:18px;bottom:16px;font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory);background:rgba(11,18,32,.55);padding:7px 12px;border-radius:2px}
.show .a{grid-column:1/8;grid-row:1/3;aspect-ratio:auto}
.show .b,.show .c{grid-column:8/13;aspect-ratio:6/5}
.show .d{grid-column:1/13;aspect-ratio:21/8}
@media (max-width:760px){.show .a,.show .b,.show .c,.show .d{grid-column:1/13;grid-row:auto;aspect-ratio:4/4.4}.show .d{aspect-ratio:4/3}}

/* reviews */
.revs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.rev{background:var(--white);border:1px dashed var(--line);padding:28px;display:grid;gap:16px;border-radius:3px}
.rev .tag{justify-self:start;font:500 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);border:1px solid var(--gold);padding:5px 10px;border-radius:2px}
.stars{display:flex;gap:4px;color:var(--line)}
.ln{height:9px;border-radius:5px;background:var(--line)}
.rev-note{margin-top:28px;color:var(--muted);font-size:14px;text-align:center}
@media (max-width:860px){.revs{grid-template-columns:minmax(0,1fr)}}

/* faq */
.faq{max-width:820px;margin-inline:auto;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;font:400 clamp(1.2rem,2.4vw,1.5rem)/1.3 var(--serif)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .i{transition:transform .35s var(--ease);color:var(--gold-ink)}
.faq details[open] summary .i{transform:rotate(45deg)}
.faq .ans{padding:0 0 26px;color:var(--muted);max-width:62ch}

/* cta band */
.band{text-align:center;display:grid;gap:26px;justify-items:center}
.band h2{max-width:18ch}

/* page header */
.ph-head{background:var(--navy);color:var(--ivory);padding-block:clamp(48px,8vw,104px)}
.ph-head .in{display:grid;gap:16px;max-width:60ch}
.ph-head h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.04}
.ph-head h1 em{color:var(--gold)}
.ph-head p{color:var(--muted-dark);font-size:18px}
.ph-head p.eyebrow{color:var(--gold);font-size:12px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:28px;letter-spacing:.04em}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}

/* shop */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:36px 22px}
.pcard{display:grid;gap:14px;align-content:start;min-width:0}
.pcard .tile{aspect-ratio:4/5;box-shadow:var(--shadow)}
.pcard a.cover{text-decoration:none;display:block}
.pcard h3{font:500 22px/1.2 var(--serif)}
.pcard .meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.soon{border:1px dashed var(--gold-ink);border-radius:3px;aspect-ratio:4/5;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;color:var(--muted)}
.soon h3{font:500 24px var(--serif);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.chip{border:1px solid var(--line);background:transparent;padding:9px 18px;border-radius:999px;font-size:13px;letter-spacing:.06em}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--ivory);border-color:var(--navy)}

/* product page extras */
.acc{margin-top:clamp(40px,6vw,80px);max-width:860px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:22px 0;font:500 22px/1.2 var(--serif)}
.acc summary::-webkit-details-marker{display:none}
.acc summary .i{transition:transform .35s var(--ease);color:var(--gold-ink)}
.acc details[open] summary .i{transform:rotate(45deg)}
.acc .body{padding:0 0 26px;color:var(--muted);display:grid;gap:12px;max-width:64ch}
.dl{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:10px 20px}
.dl dt{color:var(--navy);font-weight:500}

/* text pages */
.prose{max-width:760px;display:grid;gap:36px}
.prose h2{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:12px}
.prose p{color:var(--muted);margin-bottom:10px}
.prose ul{display:grid;gap:8px;color:var(--muted);padding-left:18px;list-style:disc}
.two-col{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,6vw,80px);align-items:start}
.vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.val{display:grid;gap:8px;padding-top:18px;border-top:1px solid var(--gold)}
.val h3{font:500 22px var(--serif)}
.val p{color:var(--muted);font-size:15px}
.cinfo{display:grid;gap:22px}
.cinfo li{display:flex;gap:16px;align-items:flex-start}
.cinfo .i{color:var(--gold-ink);margin-top:3px}
.cinfo b{display:block;font:500 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card-form{background:var(--white);padding:clamp(22px,4vw,40px);border-radius:3px;box-shadow:var(--shadow);display:grid;gap:18px}
@media (max-width:860px){.two-col{grid-template-columns:minmax(0,1fr)}.vals{grid-template-columns:minmax(0,1fr)}}

/* forms */

function clampQty(n){n=Math.floor(Number(n))||1;return Math.max(1,Math.min(CONFIG.maxQty,n));}
function itemCount(){return cart.reduce(function(s,l){return s+l.qty;},0);}
function subtotal(){return cart.reduce(function(s,l){return s+find(l.id).price*l.qty;},0);}
function deliveryFor(district,sub){
  if(!district)return null;
  if(CONFIG.delivery.freeOver>0&&sub>=CONFIG.delivery.freeOver)return 0;
  return CONFIG.delivery.insideDistricts.indexOf(district)>-1?CONFIG.delivery.inside:CONFIG.delivery.outside;
}
function addToCart(id,qty){
  var hit=null;cart.forEach(function(l){if(l.id===id)hit=l;});
  if(hit)hit.qty=clampQty(hit.qty+qty);else cart.push({id:id,qty:clampQty(qty)});
  save();renderCart();
}

  var old=document.getElementById('ld');if(old)old.remove();
  if(!p)return;
  var s=document.createElement('script');s.type='application/ld+json';s.id='ld';
  s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product',name:p.name,description:p.short,brand:{'@type':'Brand',name:'KAVRIQEN'},offers:{'@type':'Offer',priceCurrency:'BDT',price:String(p.price),availability:p.stock==='out'?'https://schema.org/OutOfStock':'https://schema.org/InStock'}});
  document.head.appendChild(s);
}
function route(){
  var r=parse(),app=$('#app'),html;
  closeMenu();
  if(r.name==='home')html=pageHome();
  else if(r.name==='shop')html=pageShop();
  else if(r.name==='product')html=pageProduct(r.p);
  else if(r.name==='about')html=pageAbout();
  else if(r.name==='contact')html=pageContact();
  else html=policyPage(r.name);
  app.innerHTML=html;
  app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');
  if(r.name==='product'){setMeta(r.p.name+' | KAVRIQEN',r.p.short);setLd(r.p);}
  else{setMeta(TITLES[r.name],DESCS[r.name]||DESCS.home);setLd(null);}
  document.querySelectorAll('[data-nav]').forEach(function(a){if(a.dataset.nav===r.key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  var showBuy=(r.name==='home'||r.name==='product'||r.name==='shop');
  document.body.classList.toggle('has-buy',showBuy);
  renderBuyBar(showBuy,r.name==='product'?r.p:P[0]);
  if(r.name==='contact')bindContact();
}
function renderBuyBar(show,p){
  var b=$('#buybar');
  b.hidden=!show;
  if(show)b.innerHTML='<div><b>'+esc(p.name)+'</b><span>'+money(p.price)+'</span></div><button type="button" class="btn btn-gold" data-act="buy" data-pid="'+p.id+'"'+(p.stock==='out'?' disabled':'')+'>Buy Now</button>';
}

/* ---------- menu, panels, toast ---------- */
function openMenu(){
  var m=$('#menu');m.classList.add('open');m.setAttribute('aria-hidden','false');$('#burger').setAttribute('aria-expanded','true');
  document.body.classList.add('lock');setTimeout(function(){$('#menuClose').focus();},50);
}
function closeMenu(){
  var m=$('#menu');if(!m.classList.contains('open'))return;
  m.classList.remove('open');m.setAttribute('aria-hidden','true');$('#burger').setAttribute('aria-expanded','false');
  if(!document.querySelector('.panel.open'))document.body.classList.remove('lock');
}
var lastFocus=null;
function openPanel(id){
  lastFocus=document.activeElement;
  ['cart','checkout'].forEach(function(n){var el=$('#'+n);if(n===id){el.classList.add('open');el.setAttribute('aria-hidden','false');}else{el.classList.remove('open');el.setAttribute('aria-hidden','true');}});
  $('#veil').classList.add('open');document.body.classList.add('lock');
  setTimeout(function(){var c=$('#'+(id==='cart'?'cartClose':'coClose'));if(c)c.focus();},60);
}
function closePanels(){
  ['cart','checkout'].forEach(function(n){var el=$('#'+n);el.classList.remove('open');el.setAttribute('aria-hidden','true');});
  $('#veil').classList.remove('open');document.body.classList.remove('lock');
  if(lastFocus&&lastFocus.focus){try{lastFocus.focus();}catch(e){}}
}
var tt;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2200);}

/* ---------- cart UI ---------- */
function renderCart(){
  var c=itemCount(),badge=$('#badge');
  badge.textContent=c;badge.hidden=c===0;
  $('#cartBtn').setAttribute('aria-label','Open cart, '+c+(c===1?' item':' items'));
  var body=$('#cartBody'),foot=$('#cartFoot');
  if(!cart.length){
    body.innerHTML='<div class="empty"><span class="serif">Your cart is empty</span><p>Add something from the collection to begin.</p><a class="btn btn-navy" href="#shop" data-act="panels-close">Browse the shop</a></div>';
    foot.innerHTML='';foot.hidden=true;
  }else{
    foot.hidden=false;
    body.innerHTML=cart.map(function(l){
      var p=find(l.id);
      return '<div class="cl"><div class="tile">'+galImg(p,0)+'</div><div><h4>'+esc(p.name)+'</h4><div class="sub">'+money(p.price)+' each</div><div class="qty" role="group" aria-label="Quantity for '+esc(p.name)+'"><button type="button" data-act="cdec" data-pid="'+p.id+'" aria-label="Decrease quantity">'+icon('minus',14)+'</button><output>'+l.qty+'</output><button type="button" data-act="cinc" data-pid="'+p.id+'" aria-label="Increase quantity">'+icon('plus',14)+'</button></div></div><div><span class="price" style="font-size:17px">'+money(p.price*l.qty)+'</span><button type="button" class="rm" data-act="crm" data-pid="'+p.id+'">Remove</button></div></div>';
    }).join('');
    var d=CONFIG.delivery;
    foot.innerHTML='<div class="sum"><div><span>Subtotal</span><span>'+money(subtotal())+'</span></div><div class="muted"><span>Delivery</span><span>'+money(d.inside)+' inside Dhaka, '+money(d.outside)+' outside</span></div></div><p class="hint">Your exact delivery charge and total are shown at checkout. Pay by Cash on Delivery.</p><button type="button" class="btn btn-gold btn-block" data-act="checkout">Checkout '+icon('arrow',16,'arrow')+'</button>';
  }
  if(coBuilt)renderSummary();
}
function setLine(id,d){
  for(var i=0;i<cart.length;i++)if(cart[i].id===id){
    var n=cart[i].qty+d;
    if(n<1){cart.splice(i,1);}else cart[i].qty=clampQty(n);
    break;
  }
  save();renderCart();
}
function buyNow(id,qty){
  cart=[{id:id,qty:clampQty(qty)}];save();renderCart();openCheckout();
}

/* ---------- checkout ---------- */
var coBuilt=false,lastOrder=null;
function openCheckout(){
  if(!cart.length){toast('Your cart is empty');return;}
  if(!coBuilt)buildCheckout();
  showForm();renderSummary();openPanel('checkout');
}
function buildCheckout(){
  coBuilt=true;
  var opts='<option value="">Select your district</option>'+DISTRICTS.map(function(d){return '<option>'+esc(d)+'</option>';}).join('');
  $('#coBody').innerHTML=
    '<div id="coFormWrap"><p class="stepno">Step 1 of 2 &middot; Delivery details</p>'+
    '<div id="coSummary" style="margin-top:14px"></div>'+
    '<form class="co-form" id="coForm" novalidate>'+
      '<div class="fld"><label for="coName">Full name</label><input id="coName" name="name" autocomplete="name"><div class="err" id="coNameE"></div></div>'+
      '<div class="fld"><label for="coPhone">Phone number</label><input id="coPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" maxlength="18"><div class="hint">Bangladeshi mobile number, for example 01712345678</div><div class="err" id="coPhoneE"></div></div>'+
      '<div class="fld"><label for="coAlt">Alternative phone <span class="opt">(optional)</span></label><input id="coAlt" name="alt" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" maxlength="18"><div class="err" id="coAltE"></div></div>'+
      '<div class="fld"><label for="coDistrict">District</label><select id="coDistrict" name="district" autocomplete="address-level1">'+opts+'</select><div class="err" id="coDistrictE"></div></div>'+
      '<div class="fld"><label for="coAddress">Full delivery address</label><textarea id="coAddress" name="address" autocomplete="street-address" placeholder="House, road, area, thana"></textarea><div class="err" id="coAddressE"></div></div>'+
      '<div class="fld"><label for="coNotes">Order notes <span class="opt">(optional)</span></label><textarea id="coNotes" name="notes" placeholder="Anything we should know about your delivery"></textarea></div>'+
      '<div class="cod">'+icon('cash',24)+'<div><b>Payment: Cash on Delivery</b><span>You pay in cash when your order arrives. There is nothing to pay online.</span></div></div>'+
      '<button type="submit" class="btn btn-gold btn-block">Place Order via WhatsApp '+icon('arrow',16,'arrow')+'</button>'+
      '<p class="hint" style="text-align:center">Next, you review your order and send it to us on WhatsApp.</p>'+
    '</form></div><div id="coDone" hidden></div>';
  $('#coForm').addEventListener('submit',function(e){e.preventDefault();submitOrder();});
  $('#coDistrict').addEventListener('change',renderSummary);
  ['coName','coPhone','coAlt','coDistrict','coAddress'].forEach(function(id){
    $('#'+id).addEventListener('input',function(){clearErr(id);});
  });
}
function clearErr(id){var f=$('#'+id),e=$('#'+id+'E');if(f)f.removeAttribute('aria-invalid');if(e)e.textContent='';}
function setErr(id,msg){var f=$('#'+id),e=$('#'+id+'E');f.setAttribute('aria-invalid','true');e.textContent=msg;}
function renderSummary(){
  var box=$('#coSummary');if(!box)return;
  if(!cart.length){box.innerHTML='<div class="box"><p style="padding:14px 0;color:var(--muted)">Your cart is empty. Close this panel to add a product.</p></div>';return;}
  var sub=subtotal(),dist=$('#coDistrict')?$('#coDistrict').value:'',del=deliveryFor(dist,sub);
  var lines=cart.map(function(l){
    var p=find(l.id);
    return '<div class="cl"><div class="tile">'+galImg(p,0)+'</div><div><h4>'+esc(p.name)+'</h4><div class="sub">'+money(p.price)+' each</div><div class="qty" role="group" aria-label="Quantity for '+esc(p.name)+'"><button type="button" data-act="cdec" data-pid="'+p.id+'" aria-label="Decrease quantity">'+icon('minus',14)+'</button><output>'+l.qty+'</output><button type="button" data-act="cinc" data-pid="'+p.id+'" aria-label="Increase quantity">'+icon('plus',14)+'</button></div></div><div><span class="price" style="font-size:17px">'+money(p.price*l.qty)+'</span><button type="button" class="rm" data-act="crm" data-pid="'+p.id+'">Remove</button></div></div>';
  }).join('');
  box.innerHTML='<div class="box">'+lines+'<div class="sum" style="padding:16px 0"><div><span>Subtotal</span><span>'+money(sub)+'</span></div><div><span>Delivery</span><span>'+(del===null?'Select district':(del===0?'Free':money(del)))+'</span></div><div class="tot"><span>Total</span><span>'+(del===null?money(sub)+' <small style="font-size:13px;color:var(--muted)">+ delivery</small>':money(sub+del))+'</span></div></div></div>';
}
function normPhone(v){
  var s=String(v).replace(/[\s\-()]/g,'');
  if(s.indexOf('+88')===0)s=s.slice(3);else if(s.indexOf('88')===0&&s.length===13)s=s.slice(2);
  return s;
}
function validPhone(v){return /^01[3-9]\d{8}$/.test(normPhone(v));}
function waNumber(){var n=String(CONFIG.whatsappNumber).replace(/[^\d]/g,'');return /^\d{8,15}$/.test(n)&&!/x/i.test(CONFIG.whatsappNumber)?n:'';}
function waLink(text){var n=waNumber();return 'https://wa.me/'+n+'?text='+encodeURIComponent(text);}
function submitOrder(){
  var ok=true,first=null;
  function bad(id,msg){setErr(id,msg);ok=false;if(!first)first=id;}
  var name=$('#coName').value.trim(),phone=$('#coPhone').value,alt=$('#coAlt').value,dist=$('#coDistrict').value,addr=$('#coAddress').value.trim(),notes=$('#coNotes').value.trim();
  ['coName','coPhone','coAlt','coDistrict','coAddress'].forEach(clearErr);
  if(!cart.length){toast('Your cart is empty');return;}
  if(name.length<2)bad('coName','Please enter your full name.');
  if(!validPhone(phone))bad('coPhone','Enter a valid Bangladeshi mobile number, such as 01712345678.');
  if(alt.trim()&&!validPhone(alt))bad('coAlt','Enter a valid number, or leave this empty.');
  if(!dist)bad('coDistrict','Please select your district.');
  if(addr.length<8)bad('coAddress','Please enter your full delivery address.');
  if(!ok){var f=$('#'+first);if(f)f.focus();return;}
  var sub=subtotal(),del=deliveryFor(dist,sub),ref='KQ-'+Math.floor(100000+Math.random()*900000);
  var lines=cart.map(function(l){var p=find(l.id);return '- '+p.name+' x '+l.qty+' = '+money(p.price*l.qty);}).join('\n');
  var msg='New order - KAVRIQEN\nOrder ref: '+ref+'\n\nName: '+name+'\nPhone: '+normPhone(phone)+(alt.trim()?'\nAlternative phone: '+normPhone(alt):'')+'\nDistrict: '+dist+'\nAddress: '+addr+'\n\nItems:\n'+lines+'\n\nSubtotal: '+money(sub)+'\nDelivery: '+(del===0?'Free':money(del))+'\nTotal: '+money(sub+del)+'\nPayment: Cash on Delivery'+(notes?'\n\nNotes: '+notes:'');
  lastOrder={ref:ref,msg:msg,total:sub+del};
  showDone();
}
function showForm(){var f=$('#coFormWrap'),d=$('#coDone');if(f)f.hidden=false;if(d)d.hidden=true;$('#coTitle').textContent='Checkout';}
function showDone(){
  var o=lastOrder,n=waNumber();
  $('#coFormWrap').hidden=true;
  var d=$('#coDone');d.hidden=false;$('#coTitle').textContent='Review your order';
  d.innerHTML='<p class="stepno">Step 2 of 2 &middot; Send on WhatsApp</p><div style="display:grid;gap:18px;padding-top:14px">'+
    '<span class="okmark">'+icon('check',26)+'</span><h3 class="serif" style="font-size:28px;line-height:1.15">Your order is ready to send</h3>'+
    '<p style="color:var(--muted)">Order '+esc(o.ref)+' &middot; Total '+money(o.total)+' &middot; Cash on Delivery. Your order is not placed until you press Send in WhatsApp.</p>'+
    (n?'':'<div class="notice"><b>Owner note:</b> the WhatsApp number is still a placeholder, so WhatsApp will ask you to choose a contact. Set <code>whatsappNumber</code> in the CONFIG block.</div>')+
    '<a class="btn btn-gold btn-block" id="waSend" href="'+esc(waLink(o.msg))+'" target="_blank" rel="noopener">'+icon('chat',18)+' Send order on WhatsApp</a>'+
    '<details><summary class="link-u" style="cursor:pointer;display:inline">Preview the message</summary><textarea class="preview" id="coPreview" readonly style="margin-top:12px">'+esc(o.msg)+'</textarea></details>'+
    '<div style="display:flex;flex-wrap:wrap;gap:12px"><button type="button" class="btn btn-line" data-act="copy">'+icon('copy',16)+' Copy details</button><button type="button" class="btn btn-line" data-act="edit-order">Edit details</button></div>'+
    '<button type="button" class="link-u" style="justify-self:start;color:var(--muted)" data-act="new-order">I have sent it. Start a new order</button></div>';
  $('#coBody').scrollTop=0;
}
function copyOrder(){
  var ta=$('#coPreview');if(!ta||!lastOrder)return;
  function fallback(){var det=ta.closest('details');if(det)det.open=true;ta.focus();ta.select();toast('Message selected. Copy it now.');}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastOrder.msg).then(function(){toast('Order details copied');},fallback);}else fallback();
}

/* ---------- contact form ---------- */
function bindContact(){
  var f=$('#contactForm');if(!f)return;
  var a=$('#cfSend');
  function upd(){
    var name=$('#cfName').value.trim(),ph=$('#cfPhone').value.trim(),m=$('#cfMsg').value.trim();
    var text='Hello KAVRIQEN,\n\n'+m+'\n\n- '+name+(ph?'\n  '+ph:'');
    a.href=waLink(text);
  }
  f.addEventListener('input',upd);
  f.addEventListener('submit',function(e){e.preventDefault();});
  a.addEventListener('click',function(e){
    var name=$('#cfName').value.trim(),m=$('#cfMsg').value.trim(),bad=false;
    $('#cfNameE').textContent='';$('#cfMsgE').textContent='';
    if(!name){$('#cfNameE').textContent='Please enter your name.';bad=true;}
    if(m.length<3){$('#cfMsgE').textContent='Please write a short message.';bad=true;}
    if(bad){e.preventDefault();(name?$('#cfMsg'):$('#cfName')).focus();}
  });
}

/* ---------- events ---------- */
function qtyFor(el,pid){
  var pv=el.closest('[data-pv]')||document.querySelector('#app [data-pv="'+pid+'"]');
  var out=pv&&pv.querySelector('[data-qtyval]');
  return out?clampQty(out.textContent):1;
}
function setGallery(pv,i){
  var p=find(pv.dataset.pv);if(!p)return;
  var n=galCount(p);i=(i+n)%n;pv.dataset.gi=i;
  pv.querySelector('[data-gal]').innerHTML=galImg(p,i,true);
  pv.querySelectorAll('.thumb').forEach(function(t,k){if(k===i)t.setAttribute('aria-current','true');else t.removeAttribute('aria-current');});
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,pid=t.dataset.pid;
  if(a==='menu-open')openMenu();
  else if(a==='menu-close')closeMenu();
  else if(a==='cart-open'){renderCart();openPanel('cart');}
  else if(a==='panels-close')closePanels();
  else if(a==='add'){addToCart(pid,qtyFor(t,pid));toast(find(pid).name+' added to your cart');renderCart();}
  else if(a==='buy')buyNow(pid,qtyFor(t,pid));
  else if(a==='qty'){var out=t.closest('.qty').querySelector('output');out.textContent=clampQty(Number(out.textContent)+Number(t.dataset.d));}
  else if(a==='cinc')setLine(pid,1);
  else if(a==='cdec')setLine(pid,-1);
  else if(a==='crm'){cart=cart.filter(function(l){return l.id!==pid;});save();renderCart();}
  else if(a==='checkout')openCheckout();
  else if(a==='gal'){var pv=t.closest('[data-pv]');if(pv)setGallery(pv,Number(t.dataset.i));}
  else if(a==='scroll'){var el=document.getElementById(t.dataset.to);if(el)el.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
  else if(a==='cat'){shopCat=t.dataset.cat;route();}
  else if(a==='copy')copyOrder();
  else if(a==='edit-order')showForm();
  else if(a==='new-order'){cart=[];save();renderCart();var f=$('#coForm');if(f)f.reset();lastOrder=null;showForm();closePanels();toast('Cart cleared');}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(document.querySelector('.panel.open'))closePanels();
  else if($('#menu').classList.contains('open'))closeMenu();
});
/* swipe on the product gallery */
var sx=null;
document.addEventListener('touchstart',function(e){var g=e.target.closest('[data-gal]');sx=g?e.touches[0].clientX:null;},{passive:true});
document.addEventListener('touchend',function(e){
  if(sx===null)return;
  var g=e.target.closest('[data-gal]');var dx=e.changedTouches[0].clientX-sx;sx=null;
  if(!g||Math.abs(dx)<40)return;
  var pv=g.closest('[data-pv]');if(pv)setGallery(pv,Number(pv.dataset.gi)+(dx<0?1:-1));
},{passive:true});
window.addEventListener('hashchange',function(){
  var r=parse();
  if(document.querySelector('.panel.open'))closePanels();
  route();window.scrollTo(0,0);
});

renderChrome();renderCart();route();
})();
</script>

</body></html>
